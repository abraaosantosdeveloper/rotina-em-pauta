<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Rotina em Pauta | Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
        </div>
        <span>Pauta</span>
      </div>
      <div class="searchwrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input id="search" type="text" placeholder="Pesquisar tarefas ou etapas...">
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" id="btnNewTask">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span class="btn-label">Nova tarefa</span>
        </button>
      </div>
    </header>

    <nav class="sidebar">
      <div class="side-section">
        <div class="side-label">Visualizar</div>
        <button class="side-item active" data-filter="all">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
          </svg>
          Todas as tarefas <span class="count" id="cnt-all">0</span>
        </button>
        <button class="side-item" data-filter="today">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          Hoje <span class="count" id="cnt-today">0</span>
        </button>
        <button class="side-item" data-filter="week">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 3" />
          </svg>
          Esta semana <span class="count" id="cnt-week">0</span>
        </button>
        <button class="side-item" data-filter="recurring">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2l4 4-4 4" />
            <path d="M3 11V9a4 4 0 0 1 4-4h14" />
            <path d="M7 22l-4-4 4-4" />
            <path d="M21 13v2a4 4 0 0 1-4 4H3" />
          </svg>
          Recorrentes <span class="count" id="cnt-recurring">0</span>
        </button>
        <button class="side-item" data-filter="completed">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5" />
          </svg>
          Concluídas <span class="count" id="cnt-completed">0</span>
        </button>
      </div>
      <div class="side-footer">
        Tudo salvo neste navegador (localStorage). Nada é enviado para a nuvem.
      </div>
    </nav>

    <main class="content">
      <div class="content-head">
        <div>
          <h1 id="viewTitle">Todas as tarefas</h1>
          <p id="viewSubtitle">Organize a faculdade e o dia a dia num só lugar.</p>
        </div>
      </div>
      <div class="task-list" id="taskList"></div>
    </main>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Nova tarefa</h2>
        <button class="icon-btn" id="btnCloseModal">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="fTitle">Título</label>
          <input type="text" id="fTitle" placeholder="Ex: Estudar para prova de cálculo">
        </div>
        <div class="field">
          <label for="fDesc">Descrição</label>
          <textarea id="fDesc" placeholder="Detalhes, links, o que precisa ser feito..."></textarea>
        </div>
        <div class="field row3">
          <div>
            <label for="fDate">Data</label>
            <input type="date" id="fDate">
          </div>
          <div>
            <label for="fTime">Hora</label>
            <input type="time" id="fTime">
          </div>
          <div>
            <label for="fRepeat">Repetir</label>
            <select id="fRepeat">
              <option value="none">Não repetir</option>
              <option value="daily">Diariamente</option>
              <option value="weekly">Semanalmente</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Etapas</label>
          <div id="subtaskEditors"></div>
          <button type="button" class="add-subtask-btn" id="btnAddSubtask">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
            Adicionar etapa
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btnCancel">Cancelar</button>
        <button class="btn btn-primary" id="btnSave">Salvar tarefa</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./script.js"></script>
</body>

</html>
